name: Build and Publish Docker Image

on:
  push:
    branches: [v5-develop]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: distribution/docker-build/Dockerfile.custom
          push: true
          tags: ghcr.io/myths420/sonarr:latest
