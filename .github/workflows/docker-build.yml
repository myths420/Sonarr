name: Build and Publish Docker Image

# Builds distribution/docker-build/Dockerfile.custom (frontend + backend
# from source) and pushes it to ghcr.io/<owner>/sonarr so a server can
# just `image:` it -- no local build.
#
# One-time setup on the fork:
#   1. Actions tab -> enable workflows.
#   2. After the first successful run, make the package public:
#      github.com/users/<owner>/packages/container/sonarr/settings
#      -> Change visibility -> Public.

on:
  push:
    branches:
      - v5-develop
      - animesite-sites-catalogue
    paths-ignore:
      - 'distribution/page-resolver/**'
      - '.github/workflows/page-resolver.yml'
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sonarr
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'animesite-sites-catalogue' }}
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: distribution/docker-build/Dockerfile.custom
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
