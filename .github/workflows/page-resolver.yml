name: page-resolver image

# Builds distribution/page-resolver and pushes it to
# ghcr.io/<owner>/sonarr-page-resolver so Dockge can just pull it.
#
# One-time setup on the fork:
#   1. Actions tab -> enable workflows (forks disable them by default).
#   2. After the first run, make the package public:
#      github.com/users/<owner>/packages/container/sonarr-page-resolver/settings
#      -> Change visibility -> Public
#      (otherwise `docker pull` needs a token).

on:
  push:
    branches:
      - animesite-sites-catalogue
    paths:
      - 'distribution/page-resolver/**'
      - '.github/workflows/page-resolver.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sonarr-page-resolver
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: distribution/page-resolver
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
