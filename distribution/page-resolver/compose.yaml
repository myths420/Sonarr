# Dockge stack for page-resolver.
#
# Nothing to copy -- this builds straight from the repo subfolder on
# GitHub. Paste into a new Dockge stack and deploy. First deploy pulls a
# Playwright/Chromium base image (~500 MB) once.
#
# Then in Sonarr: Settings > Indexers > <AnimeSite indexer> >
#   Page Resolver URL = http://page-resolver:3000
# (both on proxynet, so the container name resolves)

services:
  page-resolver:
    build:
      context: "https://github.com/myths420/Sonarr.git#animesite-sites-catalogue:distribution/page-resolver"
    container_name: page-resolver
    restart: unless-stopped
    shm_size: 1gb          # Chromium crashes with the default 64 MB
    environment:
      - PORT=3000
      - NAV_TIMEOUT_MS=45000
    ports:
      - 3000:3000
    networks:
      - proxynet
    labels:
      - swag=enable

networks:
  proxynet:
    external: true
