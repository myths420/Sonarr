# Dockge stack for page-resolver.
#
# Nothing to copy -- this builds straight from the repo subfolder on
# GitHub. Paste into a new Dockge stack and deploy. First deploy pulls a
# Playwright/Chromium base image (~500 MB) once.
#
# Then in Sonarr: Settings > Indexers > <AnimeSite indexer> >
#   Page Resolver URL = http://page-resolver:3000
# (both on proxynet, so the container name resolves)

services:
  page-resolver:
    # Prebuilt image (GitHub Actions builds distribution/page-resolver on
    # every push to the branch). Dockge just pulls it -- no local build.
    image: ghcr.io/myths420/sonarr-page-resolver:latest
    container_name: page-resolver
    restart: unless-stopped
    shm_size: 1gb          # Chromium crashes with the default 64 MB
    # Cloudflare's challenge platform pulls from *.challenges.cloudflare.com
    # subdomains mid-Turnstile; a flaky container resolver breaks the widget.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PORT=3000
      - NAV_TIMEOUT_MS=45000
      # Optional -- only needed for Turnstile-gated hosts (vik1ngfile).
      # - CAPTCHA_PROVIDER=capsolver        # or 2captcha
      # - CAPTCHA_API_KEY=your-key-here
    # Host port optional -- Sonarr reaches it on proxynet as
    # http://page-resolver:3000. Add `ports: ["3003:3000"]` to curl it.
    networks:
      - proxynet
    labels:
      - swag=enable

networks:
  proxynet:
    external: true
